services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-lab8-app:1.0
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data: